name: cleanup-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Compile Python
        run: python -m compileall -q wildlocate tests
      - name: Install editable package
        run: python -m pip install -e .
      - name: Static Python checks
        run: |
          python -m pip install ruff
          ruff check wildlocate tests --select F
      - name: Import outside repository
        run: cd /tmp && python -c "import wildlocate; print(wildlocate.__file__)"
      - name: Console entry point outside repository
        run: cd /tmp && wildlocate --help
      - name: Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check wildlocate/web/app.js
      - name: Browser regression tests
        run: node --test tests/web_client.test.cjs
